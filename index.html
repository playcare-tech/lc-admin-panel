<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveChat Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="login" class="container mt-5">
        <h2>Admin Login</h2>
        <form id="loginForm">
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    </div>
    <div id="app" class="container mt-5" style="display: none;">
        <h1>LiveChat and HelpDesk Admin</h1>
        <div class="mb-3">
            <label for="token" class="form-label">API Token</label>
            <input id="token" type="password" class="form-control" placeholder="Enter API Token">
        </div>
        <nav class="nav nav-tabs" id="nav-tab" role="tablist">
            <button class="nav-link active" id="users-tab" data-bs-toggle="tab" data-bs-target="#users" type="button" role="tab">Users</button>
            <button class="nav-link" id="groups-tab" data-bs-toggle="tab" data-bs-target="#groups" type="button" role="tab">Groups</button>
            <button class="nav-link" id="logs-tab" data-bs-toggle="tab" data-bs-target="#logs" type="button" role="tab">Logs</button>
        </nav>
        <div class="tab-content" id="nav-tabContent">
            <div class="tab-pane fade show active" id="users" role="tabpanel">
                <!-- User management -->
                <h3>Create/Deactivate User</h3>
                <form id="userForm">
                    <div class="mb-3">
                        <label class="form-label">Platform</label>
                        <select id="platform" class="form-select">
                            <option value="livechat">LiveChat</option>
                            <option value="helpdesk">HelpDesk</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="userName" class="form-label">Name</label>
                        <input type="text" id="userName" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="userEmail" class="form-label">Email</label>
                        <input type="email" id="userEmail" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-success">Create User</button>
                </form>
                <div class="mt-3">
                    <select id="deactivateUser" class="form-select">
                        <option value="">Select user to deactivate</option>
                    </select>
                    <button id="deactivateBtn" class="btn btn-danger mt-2">Deactivate</button>
                </div>
            </div>
            <div class="tab-pane fade" id="groups" role="tabpanel">
                <!-- Group management -->
                <h3>Assign/Unassign to Groups</h3>
                <div class="mb-3">
                    <label class="form-label">Select Agents</label>
                    <select id="agents" class="form-select" multiple>
                        <!-- Options populated by JS -->
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Select Groups</label>
                    <select id="groupsSelect" class="form-select" multiple>
                        <!-- Options populated by JS -->
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Priority</label>
                    <select id="priority" class="form-select">
                        <option value="first">Primary</option>
                        <option value="normal">Last</option>
                    </select>
                </div>
                <button id="assignBtn" class="btn btn-primary">Assign</button>
                <button id="unassignBtn" class="btn btn-warning">Unassign</button>
                <h4>Current Group Memberships</h4>
                <ul id="membershipList"></ul>
            </div>
            <div class="tab-pane fade" id="logs" role="tabpanel">
                <!-- Logs -->
                <h3>Logs</h3>
                <table class="table" id="logsTable">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Action</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
