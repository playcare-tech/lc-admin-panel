<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LC Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container-fluid app-shell px-3 px-lg-4 py-3">
      <section id="loginView" class="login-wrap">
        <div class="login-card">
          <h1 class="login-title">LC Admin</h1>
          <form id="loginForm" class="row g-2">
            <div class="col-12">
              <input id="username" name="username" type="text" class="form-control" placeholder="Username" required />
            </div>
            <div class="col-12">
              <input id="password" name="password" type="password" class="form-control" placeholder="Password" required />
            </div>
            <div class="col-12 d-grid">
              <button type="submit" class="btn btn-primary">Sign in</button>
            </div>
          </form>
          <div id="loginMessage" class="status-line mt-2" aria-live="polite"></div>
        </div>
      </section>

      <section id="appView" class="d-none">
        <header class="topbar mb-3">
          <div class="topbar-title">LC Admin</div>
          <div class="topbar-actions">
            <span id="sessionBadge" class="session-badge"></span>
            <button id="refreshBtn" class="btn btn-sm btn-outline-secondary">Refresh</button>
            <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Logout</button>
          </div>
        </header>

        <div id="statusMessage" class="status-line mb-2" aria-live="polite"></div>

        <ul class="nav compact-tabs mb-3" role="tablist">
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active"
              id="livechat-tab"
              data-bs-toggle="tab"
              data-bs-target="#livechat-pane"
              type="button"
              role="tab"
            >
              LiveChat
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="helpdesk-tab"
              data-bs-toggle="tab"
              data-bs-target="#helpdesk-pane"
              type="button"
              role="tab"
            >
              HelpDesk
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="logs-tab"
              data-bs-toggle="tab"
              data-bs-target="#logs-pane"
              type="button"
              role="tab"
            >
              Logs
            </button>
          </li>
        </ul>

        <div class="tab-content">
          <div class="tab-pane fade show active" id="livechat-pane" role="tabpanel">
            <div id="livechatContent"></div>
          </div>
          <div class="tab-pane fade" id="helpdesk-pane" role="tabpanel">
            <div id="helpdeskContent"></div>
          </div>
          <div class="tab-pane fade" id="logs-pane" role="tabpanel">
            <div id="logsContent"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
