<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Admin Control Room</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-bg"></div>
    <main class="container-fluid px-3 px-lg-4 py-4 py-lg-5">
      <section id="loginView" class="view-shell">
        <div class="row justify-content-center">
          <div class="col-12 col-md-9 col-lg-6 col-xl-5">
            <div class="glass-card login-card p-4 p-lg-5">
              <div class="eyebrow">Cloudflare Pages + D1</div>
              <h1 class="display-title mb-3">Text Admin Control Room</h1>
              <p class="muted-copy mb-4">
                Manage LiveChat agents, HelpDesk agents, memberships, and audit logs from
                one secured internal console.
              </p>
              <form id="loginForm" class="row g-3">
                <div class="col-12">
                  <label class="form-label" for="username">Admin username</label>
                  <input id="username" name="username" type="text" class="form-control" required />
                </div>
                <div class="col-12">
                  <label class="form-label" for="password">Password</label>
                  <input
                    id="password"
                    name="password"
                    type="password"
                    class="form-control"
                    required
                  />
                </div>
                <div class="col-12 d-grid">
                  <button type="submit" class="btn btn-primary btn-lg">
                    Sign in to admin
                  </button>
                </div>
              </form>
              <div id="loginMessage" class="status-line mt-3" aria-live="polite"></div>
            </div>
          </div>
        </div>
      </section>

      <section id="appView" class="view-shell d-none">
        <div class="glass-card shell-card p-3 p-lg-4 mb-4">
          <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 align-items-lg-center">
            <div>
              <div class="eyebrow">Operational workspace</div>
              <h1 class="display-title mb-2">Agent and group management</h1>
              <p class="muted-copy mb-0">
                Bulk assignments, deactivation flows, current memberships, and D1 audit
                history.
              </p>
            </div>
            <div class="d-flex flex-wrap gap-2 align-items-center">
              <span id="sessionBadge" class="session-badge"></span>
              <button id="refreshBtn" class="btn btn-outline-light">
                <i class="bi bi-arrow-repeat me-2"></i>Refresh
              </button>
              <button id="logoutBtn" class="btn btn-light">
                <i class="bi bi-box-arrow-right me-2"></i>Logout
              </button>
            </div>
          </div>
        </div>

        <div id="statusMessage" class="status-line mb-3" aria-live="polite"></div>

        <section id="metricRow" class="row g-3 mb-4"></section>

        <ul class="nav liquid-tabs mb-4" id="appTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active"
              id="livechat-tab"
              data-bs-toggle="tab"
              data-bs-target="#livechat-pane"
              type="button"
              role="tab"
            >
              LiveChat
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="helpdesk-tab"
              data-bs-toggle="tab"
              data-bs-target="#helpdesk-pane"
              type="button"
              role="tab"
            >
              HelpDesk
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="logs-tab"
              data-bs-toggle="tab"
              data-bs-target="#logs-pane"
              type="button"
              role="tab"
            >
              Logs
            </button>
          </li>
        </ul>

        <div class="tab-content">
          <div class="tab-pane fade show active" id="livechat-pane" role="tabpanel">
            <div id="livechatContent"></div>
          </div>
          <div class="tab-pane fade" id="helpdesk-pane" role="tabpanel">
            <div id="helpdeskContent"></div>
          </div>
          <div class="tab-pane fade" id="logs-pane" role="tabpanel">
            <div id="logsContent"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
