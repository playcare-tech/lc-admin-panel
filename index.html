<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LC Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-background"></div>

    <section id="loginView" class="login-screen">
      <div class="login-card">
        <div class="brand-mark">LC Admin</div>
        <div class="login-subtitle">Internal management console</div>
        <form id="loginForm" class="row g-2 mt-3">
          <div class="col-12">
            <input id="username" name="username" type="text" class="form-control" placeholder="Username" required />
          </div>
          <div class="col-12">
            <input id="password" name="password" type="password" class="form-control" placeholder="Password" required />
          </div>
          <div class="col-12 d-grid">
            <button type="submit" class="btn btn-primary">Sign in</button>
          </div>
        </form>
        <div id="loginMessage" class="status-line mt-2" aria-live="polite"></div>
      </div>
    </section>

    <section id="appView" class="app-layout d-none">
      <aside class="sidebar">
        <div class="sidebar-brand">LC Admin</div>
        <div class="sidebar-group">
          <div class="sidebar-label">LiveChat</div>
          <button class="sidebar-link active" data-section="livechat-users">Users</button>
          <button class="sidebar-link" data-section="livechat-groups">Groups</button>
          <button class="sidebar-link" data-section="create-livechat-user">Create user</button>
          <button class="sidebar-link" data-section="livechat-analytics">Analytics</button>
        </div>
        <div class="sidebar-group">
          <div class="sidebar-label">HelpDesk</div>
          <button class="sidebar-link" data-section="helpdesk-users">Users</button>
          <button class="sidebar-link" data-section="helpdesk-groups">Groups</button>
          <button class="sidebar-link" data-section="create-helpdesk-user">Create user</button>
          <button class="sidebar-link" data-section="helpdesk-analytics">
            <i class="bi bi-graph-up"></i> Analytics
          </button>
        </div>
        <div class="sidebar-group">
          <div class="sidebar-label">Access</div>
          <button class="sidebar-link" data-section="admin-users">Admin users</button>
          <button class="sidebar-link" data-section="logs">Logs</button>
        </div>
      </aside>

      <main class="workspace">
        <header class="workspace-topbar">
          <div>
            <div id="pageTitle" class="page-title">LiveChat Users</div>
            <div id="statusMessage" class="status-line mt-1" aria-live="polite"></div>
          </div>
          <div class="topbar-actions">
            <span id="sessionBadge" class="session-badge"></span>
            <button id="refreshBtn" class="btn btn-sm btn-outline-secondary">Refresh</button>
            <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Logout</button>
          </div>
        </header>

        <div id="filterBar" class="workspace-filter-bar d-none"></div>

        <div id="appContent" class="workspace-content"></div>
      </main>
    </section>

    <div id="modalRoot"></div>

    <script src="script.js"></script>
  </body>
</html>
