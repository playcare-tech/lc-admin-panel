name: HelpDesk Analytics Sync

on:
  schedule:
    - cron: '5 * * * *'  # every hour at :05 (offset avoids top-of-hour congestion)
  workflow_dispatch:       # allow manual trigger from GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync HelpDesk analytics (last hour)
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.HELPDESK_SYNC_URL }}" \
            -H "Authorization: Bearer ${{ secrets.HELPDESK_SYNC_TOKEN }}" \
            -H "Content-Type: application/json")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"
          [ "$status" = "200" ] || exit 1
